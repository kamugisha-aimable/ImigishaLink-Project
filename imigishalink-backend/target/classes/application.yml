spring:
  application:
    name: imigishalink-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/imigishalink
    username: postgres
    password: VAO123@ntagombizi
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true  # Enable to see SQL queries (set to false in production)
    properties:
      hibernate:
        'format_sql': true
        jdbc:
          'batch_size': 20
        'order_inserts': true
        'order_updates': true
    open-in-view: false
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/json,application/javascript
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 3600000 # 1 hour in milliseconds
    refresh-token:
      expiration: 604800000 # 7 days in milliseconds

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://localhost:5173"
  
  file:
    upload-dir: ./uploads
    max-size: 10485760 # 10MB
  
  email:
    verification:
      expiration-hours: 24
    password-reset:
      expiration-hours: 1
  security:
    two-factor:
      expiration-minutes: 10

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.data.jpa: INFO
    com.imigishalink: DEBUG
  file:
    name: logs/imigishalink.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always